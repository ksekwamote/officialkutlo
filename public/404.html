<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 | Lost But Not Forsaken</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "#0A0A0A",
            surface: "#121414",
            "primary-container": "#d4af37",
            primary: "#f2ca50",
            "on-background": "#e2e2e2",
          },
          fontFamily: {
            headline: ["Epilogue", "sans-serif"],
            body: ["Inter", "sans-serif"],
            bebas: ["Bebas Neue", "sans-serif"],
          },
        },
      },
    };
  </script>

  <style>
    body {
      background: #0A0A0A;
      color: #e2e2e2;
    }

    .film-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.035;
      background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,.08) 0 1px, transparent 1px);
      background-size: 4px 4px;
    }

    .gold-line {
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
    }

    .glass-card {
      background: rgba(18, 18, 18, 0.45);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.06);
    }
  </style>
</head>

<body class="font-body bg-background text-on-background selection:bg-primary-container selection:text-black">
  <div class="film-grain"></div>

  <main class="relative min-h-screen flex items-center justify-center overflow-hidden px-6 py-20">
    <!-- Background glow -->
    <div class="absolute top-20 left-10 w-72 h-72 bg-primary-container/10 blur-[120px] rounded-full"></div>
    <div class="absolute bottom-20 right-10 w-96 h-96 bg-[#8B5A2B]/20 blur-[140px] rounded-full"></div>

    <!-- Background text -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none select-none">
      <h1 class="font-bebas text-[180px] sm:text-[260px] md:text-[360px] leading-none text-white/[0.025]">
        404
      </h1>
    </div>

    <section class="relative z-10 max-w-4xl mx-auto text-center">
      <p class="text-primary-container text-[11px] tracking-[0.5em] uppercase mb-8">
        Page Not Found
      </p>

      <h1 class="font-bebas text-6xl sm:text-7xl md:text-9xl leading-none text-white mb-8">
        LOST, BUT NOT <br />
        FORSAKEN.
      </h1>

      <div class="w-32 h-px gold-line mx-auto mb-10"></div>

      <div class="glass-card p-8 md:p-10 mb-10">
        <p class="text-white/70 text-lg md:text-xl leading-relaxed mb-6">
          Looks like this page wandered into the wilderness.
        </p>

        <p class="text-white/50 leading-relaxed">
          But don’t worry — even the lost sheep gets found. Let’s get you back home.
        </p>

        <p class="text-primary-container text-sm tracking-[0.25em] uppercase mt-8">
          Luke 15:4
        </p>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-5">
        <a
          href="/"
          class="w-full sm:w-auto bg-primary-container text-black px-10 py-4 text-[11px] tracking-[0.25em] uppercase hover:bg-white transition flex items-center justify-center gap-3"
        >
          <span class="material-symbols-outlined text-[18px]">home</span>
          Return Home
        </a>

       
      </div>
    </section>
  </main>
</body>
</html>
